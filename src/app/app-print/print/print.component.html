<main>
    <header class="bg">
        <div>
            <p>Print Voucher Controll Works!</p>
        </div>
        <div class="flex-col width100">
            <div class=" flex-col margin-top5px">
                <input type="text" class="search-field" type="text" (keyup)="searchingPartyEvent($event)"
                    [(ngModel)]="searchingParty" placeholder="Search by name date amount">
            </div>
            <br>
            <hr>
        </div>
    </header>
    <div class="flex-col bg margin5px  overflow-auto">
        <div class="flex-col width100">
            <!-- <div> -->
            <table mat-table matSort [dataSource]="printDataSource">
                <!-- printCloumn = ['accountId', 'accountName', 'voucherDate', 'voucherAmount', 'voucherType', 'editAction','printAction'] -->
                <ng-main-container matColumnDef="accountId">
                    <th mat-header-cell *matHeaderCellDef>P-Id</th>
                    <td mat-cell *matCellDef="let element">
                        {{element.accountId}}
                    </td>
                </ng-main-container>
                <!-- printCloumn = ['accountId', 'accountName', 'voucherDate', 'voucherAmount', 'voucherType', 'editAction','printAction'] -->
                <ng-main-container matColumnDef="accountName">
                    <th mat-header-cell *matHeaderCellDef>Party Name</th>
                    <td mat-cell *matCellDef="let element">
                        {{element.accountName}}
                    </td>
                </ng-main-container>
                <!-- printCloumn = ['accountId', 'accountName', 'voucherDate', 'voucherAmount', 'voucherType', 'editAction','printAction'] -->
                <ng-main-container matColumnDef="voucherDate">
                    <th mat-header-cell *matHeaderCellDef>Date</th>
                    <td mat-cell *matCellDef="let element">
                        {{element.bookInfoDate}}
                    </td>
                </ng-main-container>
                <!-- printCloumn = ['accountId', 'accountName', 'voucherDate', 'voucherAmount', 'voucherType', 'editAction','printAction'] -->
                <ng-main-container matColumnDef="voucherAmount">
                    <th mat-header-cell *matHeaderCellDef>Amount</th>
                    <td mat-cell *matCellDef="let element">
                        {{element.bookDetailsParticularAmount}}
                    </td>
                </ng-main-container>
                <!-- printCloumn = ['accountId', 'accountName', 'voucherDate', 'voucherAmount', 'voucherType', 'editAction','printAction'] -->
                <ng-main-container matColumnDef="voucherType">
                    <th mat-header-cell *matHeaderCellDef>Voucher Type</th>
                    <td mat-cell *matCellDef="let element">
                        {{element.bookInfoNarration}}
                    </td>
                </ng-main-container>


                <ng-main-container matColumnDef="editAction">
                    <th mat-header-cell *matHeaderCellDef style="width: 10% !important;"><strong>Action
                        </strong></th>
                    <td mat-cell *matCellDef="let element;"><button (click)="updateVoucher(element)" ngClass="underline cursore-pointer">Edit</button>
                    </td>
                </ng-main-container>
                <ng-main-container matColumnDef="printAction">
                    <th mat-header-cell *matHeaderCellDef style="width: 10% !important;"><strong>Action
                        </strong></th>
                    <td mat-cell *matCellDef="let element;"><button (click)="printingAction(element)" ngClass="cursore-pointer">Print</button>
                    </td>
                </ng-main-container>
                <ng-main-container matColumnDef="deleteAction">
                    <th mat-header-cell *matHeaderCellDef style="width: 10% !important;"><strong>Action
                        </strong></th>
                    <td mat-cell *matCellDef="let element;"><button (click)="deleteInvoice(element)" id="delete-btn" ngClass="cursore-pointer">Delete</button>
                    </td>
                </ng-main-container>

                <tr mat-header-row ngClass="mat-header-row" *matHeaderRowDef="printCloumn"></tr>
                <tr mat-row ngClass="mat-row" (click)="clickedRows.add(row)" [class.demo-row-is-clicked]="clickedRows.has(row)"
                    *matRowDef="let row; columns: printCloumn;">
                </tr>
            </table>

            <!-- <div><textarea name="" id="" cols="30" rows="10">{{data|json}}</textarea></div> -->

        </div>
    </div>
</main>
