<main>
    <header class="bg">
        <div>
            <p>EMI Controll Works!</p>
        </div>
        <div class="flex-col width100">
            <div class=" flex-col margin-top5px">
                <input type="text" class="search-field" type="text" (keyup)="searchingPartyEvent($event)"
                    [(ngModel)]="searchingParty" placeholder="Search by name date amount">
            </div>
            <br>
            <hr>
        </div>
    </header>
    <div class="flex-col bg margin5px  overflow-auto">
        <div class="flex-col width100">
            <!-- <div> -->



            <table mat-table matSort [dataSource]="EmiConfigDaraSource">
                <ng-main-container matColumnDef="partyName">
                    <th mat-header-cell *matHeaderCellDef>Party Name</th>
                    <td mat-cell *matCellDef="let element;let i = index">
                        {{element.accountName}}
                    </td>
                </ng-main-container>
                <!-- EmiConfigTableColumn = ['partyName', 'emiNo', 'emiAmount', 'emiStatus','emiSmsStatus', 'emiDate', 'action']; -->

                <ng-main-container matColumnDef="emiNo">
                    <th mat-header-cell *matHeaderCellDef><strong><strong>Emi-No</strong></strong></th>
                    <td mat-cell *matCellDef="let element;let i = index">
                        <strong>{{element.emiNo}}</strong>
                    </td>
                </ng-main-container>
                <!-- EmiConfigTableColumn = ['partyName', 'emiNo', 'emiAmount', 'emiStatus','emiSmsStatus', 'emiDate', 'action']; -->

                <ng-main-container matColumnDef="emiAmount">
                    <th mat-header-cell *matHeaderCellDef><strong> Emi-Amount
                        </strong></th>
                    <td mat-cell *matCellDef="let element"> <strong>{{element.emiAmount}}</strong>
                    </td>
                </ng-main-container>
                <ng-main-container matColumnDef="emiMessage">
                    <th mat-header-cell *matHeaderCellDef><strong>Text Message</strong></th>
                    <td mat-cell *matCellDef="let element"><input placeholder="Name" [value]="element.emiMessage"
                            [(ngModel)]="element.emiMessage">
                    </td>
                </ng-main-container>
                <!-- EmiConfigTableColumn = ['partyName', 'emiNo', 'emiAmount', 'emiStatus','emiSmsStatus', 'emiDate', 'action']; -->

                <ng-main-container matColumnDef="emiStatus">
                    <th mat-header-cell *matHeaderCellDef><strong>Current Status</strong></th>
                    <td mat-cell *matCellDef="let element"> <strong
                            [style.color]="element.emiStatus==='Pending'? 'red' : 'rgb(44, 190, 0)'">{{element.emiStatus}}</strong>
                    </td>
                </ng-main-container>
                <!-- EmiConfigTableColumn = ['partyName', 'emiNo', 'emiAmount', 'emiStatus','emiSmsStatus', 'emiDate', 'action']; -->

                <ng-main-container matColumnDef="emiSmsStatus">
                    <th mat-header-cell *matHeaderCellDef><strong>SMS Status</strong></th>
                    <td mat-cell *matCellDef="let element">
                        <ng-container>
                            <select name="" id="" [(ngModel)]="element.emiSmsStatus">
                                <option *ngIf="element.emiSmsStatus then thenBlock;else elseBlock"
                                    [value]="element.emiSmsStatus"></option>

                            </select>
                            <ng-template #thenBlock>
                                <option [value]="element.emiSmsStatus" selected><span>Enable</span> </option>
                                <option [value]='false'><span>Desable</span></option>
                            </ng-template>
                            <ng-template #elseBlock>
                                <option [value]="element.emiSmsStatus" selected><span>Desable</span> </option>
                                <option [value]='true'><span>Enable</span></option>
                            </ng-template>
                        </ng-container>
                    </td>
                </ng-main-container>
                <!-- EmiConfigTableColumn = ['partyName', 'emiNo', 'emiAmount', 'emiStatus','emiSmsStatus', 'emiDate', 'action']; -->

                <ng-main-container matColumnDef="emiDate">
                    <th mat-header-cell *matHeaderCellDef> <strong> Emi Date</strong> </th>
                    <td mat-cell *matCellDef="let element">
                        <input id="emiDate" name="emiDate" type="date" [(ngModel)]="element.emiDate" required />
                    </td>
                </ng-main-container>
                <!-- EmiConfigTableColumn = ['partyName', 'emiNo', 'emiAmount', 'emiStatus','emiSmsStatus', 'emiDate', 'action']; -->

                <ng-main-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef style="width: 10% !important;"><strong>Action
                        </strong></th>
                    <td mat-cell *matCellDef="let element;"><button (click)="UpdateAction(element)" ngClass="underline color-blue cursore-pointer">Update</button>
                    </td>
                </ng-main-container>

                <tr mat-header-row ngClass="mat-header-row" *matHeaderRowDef="EmiConfigTableColumn"></tr>
                <tr mat-row ngClass="mat-row" (click)="clickEmiConfigTableRow.add(row)"
                    [class.demo-row-is-clicked]="clickEmiConfigTableRow.has(row)"
                    *matRowDef="let row; columns: EmiConfigTableColumn;">
                </tr>
            </table>
            <!-- </div> -->


        </div>
    </div>
</main>
