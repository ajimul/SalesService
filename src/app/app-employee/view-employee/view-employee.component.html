<main>

    <header class="bg">
        <div>
            <p>Add Employee Works!</p>
        </div>

    </header>
    <!-- party table-->
    <div class="container bg">

        <div class="action-container">
            <div class="search-bar">
                <input type="text" class="search-field" type="text" (keyup)="searchingEmployeeEvent($event)"
                    [(ngModel)]="searchingEmployee" placeholder="Search by employee name mobile no email-id">
            </div>
            <div class="create-party">
                <button type="button" (click)="openDialogCreateNewPartyAccount()"class="create-btn">
                    <strong>Create&nbsp;New</strong></button>
            </div>
        </div>
        <div>
            <hr>
        </div>
        <table mat-table matSort [dataSource]="dataSourceEmployee" class="tbl-party bg">
            <ng-main-container matColumnDef="accountId">
                <th class="party-id" *matHeaderCellDef></th>
                <td class="party-id" mat-cell *matCellDef="let element;let i = index">
                </td>
            </ng-main-container>
            <ng-main-container matColumnDef="accountName">
                <th mat-header-cell *matHeaderCellDef><strong><strong>Party Name</strong></strong></th>
                <td  mat-cell *matCellDef="let element;let i = index" >
                    <strong>{{element.accountName}}</strong>
                </td>
            </ng-main-container>

            <ng-main-container matColumnDef="empContactNo1">
                <th  mat-header-cell *matHeaderCellDef><strong> Mobile No.
                    </strong></th>
                <td  mat-cell *matCellDef="let element"> <strong>{{element.empContactNo1}}</strong>
                </td>
            </ng-main-container>
            <ng-main-container matColumnDef="empEmailId">
                <th mat-header-cell *matHeaderCellDef><strong> Email</strong></th>
                <td mat-cell *matCellDef="let element"> <strong>{{element.empEmailId}}</strong>
                </td>
            </ng-main-container>
            <ng-main-container matColumnDef="empBillingAddress">
                <th mat-header-cell *matHeaderCellDef>
                    <strong> Billing From</strong>
                </th>
                <td mat-cell *matCellDef="let element">
                    <strong>{{element.empBillingAddress}}</strong>
                </td>
            </ng-main-container>
            <ng-main-container matColumnDef="empShipingAddress">
                <th mat-header-cell *matHeaderCellDef>
                    <strong> Billing From
                </strong>
                </th>
                <td mat-cell *matCellDef="let element">
                    <strong>{{element.empShipingAddress}}</strong>
                </td>
            </ng-main-container>
            <ng-main-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef ><strong>Action
                    </strong></th>
                <td mat-cell *matCellDef="let element;">
                    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    <i class="fa  fa-pencil-square fa-lg" aria-hidden="true"
                        (click)="openDialogUpdateEmployee(element)"></i>
                </td>
            </ng-main-container>

            <tr mat-header-row *matHeaderRowDef="employeeColumns"></tr>
            <tr mat-row (click)="clickedRowsEmployee.add(row)"
                [class.demo-row-is-clicked]="clickedRowsEmployee.has(row)"
                *matRowDef="let row; columns: employeeColumns;">
            </tr>
        </table>
    </div>
</main>
<!-- end party table-->
